# The standing watch, running on its own.
#
# This is what makes Nexus an agent rather than a page with a button: every
# half hour, with nobody watching, it goes over the 59 located structures on the
# NTSB's vessel-collision list, pulls live NWS alerts and USGS river readings
# for each, decides which ones a person should hear about, and writes about
# those. The findings are committed, so every run leaves a dated, checkable
# record of what the world looked like at that moment — including the runs that
# found nothing, which is the honest half of a watch.
name: standing watch

on:
  schedule:
    # Every 30 minutes. NWS reissues alerts on its own cadence and USGS posts
    # instantaneous values every 15, so this is about as often as the underlying
    # data can actually change.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Only one sweep at a time: two runs committing findings would race on the
# artifact, and a queued sweep is stale by the time it lands anyway.
concurrency:
  group: standing-watch
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These secrets are optional and the job is built to run without them.
      # Triage — the part that decides which structures matter today — reads the
      # NWS and USGS, which are public and need no key, so an unconfigured repo
      # still publishes a full sweep every half hour. Setting GROQ_API_KEY and
      # MIREYE_API_TOKEN adds the written brief on top. Nothing here fails for
      # want of a credential; the artifact says which depth it ran at.
      - name: Sweep the fleet and brief what matters
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIREYE_API_TOKEN: ${{ secrets.MIREYE_API_TOKEN }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: npm run sweep

      - name: Commit what it found
        run: |
          git config user.name "nexus-watch"
          git config user.email "noreply@users.noreply.github.com"
          git add src/data/fleet-latest.json
          # A sweep that changed nothing is a real outcome, not a failure.
          if git diff --staged --quiet; then
            echo "nothing changed since the last sweep"
            exit 0
          fi
          # [skip ci] because the site reads this file over HTTP at request time
          # rather than bundling it — see src/app/api/fleet/route.ts. Without the
          # tag every sweep would trigger a full Netlify rebuild, 48 a day, to
          # ship a file the running site already picks up on its own.
          git commit -m "watch: sweep at $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
          # A human push between the checkout and here would otherwise fail the
          # job outright. The artifact is generated, so replaying it on top of
          # whatever landed is always right.
          git pull --rebase --autostash
          git push
